services:
  - type: web
    name: botica-nova-salud
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: botica-nova-salud-db
          property: connectionString
      - key: SERVE_FRONTEND
        value: "true"

databases:
  - name: botica-nova-salud-db
    databaseName: novasalud
    user: novasalud_user
    plan: free
    region: oregon

