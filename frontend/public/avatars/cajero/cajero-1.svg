<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cajeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="40" fill="url(#cajeroBg)"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Caja Registradora / Terminal POS -->
  <rect x="44" y="58" width="72" height="54" rx="8" fill="#134e4a" stroke="url(#tealGrad)" stroke-width="3"/>
  <rect x="52" y="66" width="56" height="20" rx="4" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="80" y="80" font-family="Courier, monospace" font-size="11" font-weight="900" fill="#5eead4" text-anchor="middle">S/ 00.00</text>
  <!-- Botones de teclado -->
  <rect x="52" y="92" width="10" height="6" rx="1.5" fill="#2dd4bf"/>
  <rect x="66" y="92" width="10" height="6" rx="1.5" fill="#2dd4bf"/>
  <rect x="80" y="92" width="10" height="6" rx="1.5" fill="#2dd4bf"/>
  <rect x="94" y="92" width="14" height="6" rx="1.5" fill="#10b981"/>
  <!-- Gaveta / Base de Efectivo -->
  <rect x="40" y="112" width="80" height="12" rx="4" fill="#0f766e" stroke="url(#tealGrad)" stroke-width="2.5"/>
  <line x1="72" y1="118" x2="88" y2="118" stroke="#ccfbf1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ticket que sale -->
  <path d="M68 40 H92 V58 H68 Z" fill="#f8fafc"/>
  <path d="M72 46 H88 M72 50 H84" stroke="#042f2e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ccfbf1" text-anchor="middle" letter-spacing="2">CAJA POS</text>
</svg>
